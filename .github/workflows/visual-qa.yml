name: Visual QA
on:
  push:
    branches: [sales-rebuild-v2]
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y
      - run: npm install --save-dev playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 > /tmp/bartss-http.log 2>&1 &
      - run: node scripts/visual-qa.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bartss-visual-qa
          path: artifacts/visual-qa
